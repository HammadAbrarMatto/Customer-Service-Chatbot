name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-genai faiss-cpu numpy streamlit pillow pandas vaderSentiment lingua-language-detector requests beautifulsoup4 python-dotenv pytest ruff
      - run: ruff check .
      - run: pytest -q
