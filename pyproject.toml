[project]
name = "customer-service-chatbot"
version = "2.0.0"
description = "Gemini RAG customer-support chatbot with sentiment, multilingual, vision, medical and arXiv features"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
